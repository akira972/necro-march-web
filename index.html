<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Necro March">
    <meta name="theme-color" content="#120e18">
    <title>Necro March build 1</title>
    <link rel="manifest" href="manifest.webmanifest?v=1">
    <link rel="icon" type="image/png" href="TemplateData/icons/icon-192.png">
    <link rel="apple-touch-icon" href="TemplateData/icons/icon-192.png">
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #120e18; overflow: hidden;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      /* Le jeu reste en portrait : sur un écran large (ordinateur, tablette couchée), il s'affiche
         en colonne centrée de format 3:4 au plus (MAX_ASPECT plus bas) ; les côtés gardent le fond. */
      #unity-canvas {
        position: fixed; top: 0; bottom: 0; left: 0; right: 0; margin: 0 auto;
        width: 100vw; width: min(100vw, calc(var(--app-h, 100dvh) * 0.75));
        height: 100vh; height: 100dvh;
        display: block; background: #120e18; outline: none; touch-action: none;
      }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 24px;
        background: #120e18; color: #d9cdf2;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity .3s;
      }
      #loading h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: .08em; }
      #bar { width: 60vw; max-width: 320px; height: 8px; border-radius: 4px; background: #2a2238; overflow: hidden; }
      #bar-fill { width: 0; height: 100%; background: #8a5cd6; transition: width .2s; }
      #version { font-size: 12px; opacity: .5; }
      /* iPhone lancé depuis l'écran d'accueil (barre d'état transparente) : iOS peut donner une
         fenêtre plus courte que l'écran et y couper les éléments « fixed » (bande vide en bas).
         Le jeu y est placé en absolu ; fitIosHomeScreen() allonge le document du manque mesuré. */
      .ios-home body { position: relative; }
      .ios-home #unity-canvas, .ios-home #loading {
        position: absolute; top: 0; left: 0; right: 0; bottom: auto; height: 100%;
      }
      .ios-home #loading { width: 100%; }
      /* Téléphone couché (écran tactile peu haut) : on demande de le redresser. */
      #rotate { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px; padding: 24px;
        background: #120e18; color: #d9cdf2; text-align: center;
        font: 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #rotate-phone { width: 34px; height: 58px; border: 3px solid #8a5cd6; border-radius: 8px;
        animation: rotate-hint 1.8s ease-in-out infinite; }
      @keyframes rotate-hint { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
      @media (orientation: landscape) and (pointer: coarse) and (max-height: 540px) {
        #rotate { display: flex; }
      }
      #diag { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
        font: 11px ui-monospace, monospace; color: #d9cdf2; text-align: center; opacity: .8;
        pointer-events: none; display: none; }
      #message { position: fixed; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0); padding: 12px;
        font: 14px system-ui, sans-serif; color: #fff; text-align: center; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>Necro March</h1>
      <div id="bar"><div id="bar-fill"></div></div>
      <div id="version">build 1</div>
    </div>
    <div id="message"></div>
    <div id="diag"></div>
    <div id="rotate"><div id="rotate-phone"></div><div id="rotate-text"></div></div>
    <script>
      // Textes de la page (le jeu a sa propre table de traduction).
      var TEXTS = {
        fr: { rotate: "Redresse ton téléphone pour jouer" },
        en: { rotate: "Turn your phone upright to play" }
      };
      var lang = /^fr/i.test(navigator.language || "") ? "fr" : "en";
      document.getElementById("rotate-text").textContent = TEXTS[lang].rotate;

      var standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

      // iPhone depuis l'écran d'accueil : si la fenêtre est plus courte que l'écran, on comble
      // le manque mesuré (rien sinon). Android et les navigateurs ne sont pas concernés.
      var iosHome = window.navigator.standalone === true;
      function fitIosHomeScreen() {
        var root = document.documentElement;
        root.style.height = "";
        var portrait = window.matchMedia("(orientation: portrait)").matches;
        var full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
        if (window.innerHeight < full) root.style.height = full + "px";
        root.style.setProperty("--app-h", Math.max(window.innerHeight, full) + "px");
      }
      if (iosHome) {
        document.documentElement.classList.add("ios-home");
        fitIosHomeScreen();
        window.addEventListener("resize", fitIosHomeScreen);
        window.addEventListener("orientationchange", function () { setTimeout(fitIosHomeScreen, 300); });
      }

      // Densité de rendu : celle de l'écran, plafonnée à ×3 et à 4 millions de pixels (les plus
      // grands iPhone restent nets en ×3) : certains Android sont en ×4 et les tablettes très grandes.
      // MAX_ASPECT = largeur max / hauteur du jeu (même 0.75 que dans le CSS de #unity-canvas).
      var MAX_PIXEL_RATIO = 3, MAX_RENDER_PIXELS = 4e6, MAX_ASPECT = 0.75;
      function renderPixelRatio() {
        var dpr = Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO);
        var h = window.innerHeight, w = Math.min(window.innerWidth, h * MAX_ASPECT);
        var area = Math.max(w * h, 1);
        return Math.min(dpr, Math.max(1, Math.sqrt(MAX_RENDER_PIXELS / area)));
      }

      // Relevé temporaire (rafraîchi chaque seconde pendant 15 s) pour régler l'affichage sur téléphone.
      // Note aussi les tailles de dessin qu'Unity demande à WebGL (« écran » = image finale, « cible » =
      // image intermédiaire) : si elles sont plus petites que le rendu, l'image est étirée donc floue.
      var drawSizes = {};
      (function () {
        var P = window.WebGL2RenderingContext && WebGL2RenderingContext.prototype;
        if (!P) return;
        var viewport = P.viewport, bindFramebuffer = P.bindFramebuffer, toScreen = true;
        P.bindFramebuffer = function (target, fb) { toScreen = !fb; return bindFramebuffer.apply(this, arguments); };
        P.viewport = function (x, y, w, h) { drawSizes[(toScreen ? "écran " : "cible ") + w + "×" + h] = 1; return viewport.apply(this, arguments); };
        var blit = P.blitFramebuffer;
        P.blitFramebuffer = function (sx0, sy0, sx1, sy1, dx0, dy0, dx1, dy1) {
          drawSizes["copie " + (sx1 - sx0) + "×" + (sy1 - sy0) + "→" + (dx1 - dx0) + "×" + (dy1 - dy0)] = 1;
          return blit.apply(this, arguments);
        };
      })();
      var diagTicks = 0;
      function showDiag() {
        var d = document.getElementById("diag");
        var probe = document.createElement("div");
        probe.style.cssText = "position:fixed;top:0;height:env(safe-area-inset-top,0px);";
        document.body.appendChild(probe);
        var top = probe.offsetHeight;
        document.body.removeChild(probe);
        var gl = canvas.getContext("webgl2");
        d.textContent = "dpr " + (window.devicePixelRatio || 1) +
          " · rendu " + canvas.width + "×" + canvas.height +
          " · affiché " + canvas.clientWidth + "×" + canvas.clientHeight +
          " · écran " + screen.width + "×" + screen.height +
          " · fenêtre " + window.innerWidth + "×" + window.innerHeight +
          " · haut " + top + " · bas " + Math.round(canvas.getBoundingClientRect().bottom) +
          (standalone ? " · accueil" : "") +
          " · tampon " + (gl ? gl.drawingBufferWidth + "×" + gl.drawingBufferHeight : "?") +
          " · dessin " + Object.keys(drawSizes).join(", ");
        d.style.display = "block";
        if (++diagTicks < 15) setTimeout(showDiag, 1000);
        else d.style.display = "none";
      }

      var version = "1";
      var v = "?v=" + encodeURIComponent(version);
      var canvas = document.getElementById("unity-canvas");
      var loading = document.getElementById("loading");
      var barFill = document.getElementById("bar-fill");
      var message = document.getElementById("message");

      // Pas de menu contextuel ni de zoom au double appui sur le jeu.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

      function showBanner(msg, type) {
        message.textContent = msg;
        message.style.background = type == "error" ? "#a01c2c" : "#5a4a10";
        message.style.display = "block";
        if (type != "error") setTimeout(function () { message.style.display = "none"; }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb" + v,
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb" + v,
        codeUrl: buildUrl + "/Web.wasm.unityweb" + v,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Necro March",
        productVersion: version,
        showBanner: showBanner,
        // Interface nette sur tous les écrans ; si les images/s baissent, c'est la 3D qu'on
        // allège avec le renderScale d'URP (PLAN B.6), pas l'interface.
        devicePixelRatio: renderPixelRatio(),
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/Web.loader.js" + v;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          barFill.style.width = (100 * progress) + "%";
        }).then(function () {
          loading.style.opacity = "0";
          setTimeout(function () { loading.style.display = "none"; }, 300);
          setTimeout(showDiag, 1000);
        }).catch(function (err) {
          showBanner(String(err), "error");
        });
      };
      script.onerror = function () { showBanner("Build introuvable : " + script.src, "error"); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
